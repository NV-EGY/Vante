<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTÉ - {{ page.title }}</title>
    
    <!-- تحسين SEO ثابت للمنتج -->
    <meta name="description" content="{{ page.description }}">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="VANTÉ - {{ page.title }}">
    <meta property="og:type" content="product">
    <!-- ✅ هنا نضع صورة المنتج مباشرة، واتساب سيقرأها فوراً -->
    <meta property="og:image" content="{{ page.image }}">
    <meta property="og:url" content="https://Vante.sbs/Product.html?id={{ page.id }}">
    
    <!-- ✅ تحويل المستخدم إلى صفحة المنتج الديناميكية -->
    <meta http-equiv="refresh" content="0; url=https://Vante.sbs/Product.html?id={{ page.id }}">
</head>
<body>
    <!-- محتوى بسيط جداً للمنتج (يمكنك تركه فارغاً) -->
    <h1 style="text-align:center; padding:50px; font-family: 'Cairo', sans-serif;">{{ page.title }}</h1>
    <p style="text-align:center;">جاري تحويلك إلى صفحة المنتج...</p>
</body>
</html>
