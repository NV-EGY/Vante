<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANTÉ - منتج</title>
    <meta name="robots" content="index, follow">
    
    <!-- هذه الميتا تاج ستتغير بواسطة السكربت -->
    <meta property="og:title" id="ogTitle" content="VANTÉ - منتج فاخر">
    <meta property="og:description" id="ogDescription" content="اكتشف منتجات VANTÉ الفاخرة">
    <meta property="og:image" id="ogImage" content="https://Vante.sbs/images/preview.jpg">
    <meta property="og:url" id="ogUrl" content="https://Vante.sbs">
    <meta property="og:type" content="product">
    
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #f8f7f4; direction: rtl; }
        h1 { color: #D4AF37; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #D4AF37; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1>✨ VANTÉ</h1>
    <p>جاري تحميل المنتج...</p>
    <div class="loader"></div>

    <script>
        (function() {
            // 1. استخراج معرف المنتج من الرابط
            // الرابط المتوقع: https://Vante.sbs/p/ID_المنتج
            const path = window.location.pathname;
            const match = path.match(/\/p\/([^\/]+)/);
            
            if (match && match[1]) {
                const productId = match[1];
                
                // 2. تحديد الـ Meta Tags ديناميكياً بناءً على المنتج
                // ملاحظة: لا يمكننا جلب البيانات من Firebase هنا لأن 404.html صفحة ثابتة ولا تنفذ Modules
                // الحل الاحترافي هو استخدام معرف المنتج فقط، والسماح لصفحة Product.html بجلب البيانات
                
                document.getElementById('ogUrl').content = `https://Vante.sbs/Product.html?id=${productId}`;
                
                // 3. تحويل المستخدم إلى صفحة المنتج الحقيقية
                setTimeout(function() {
                    window.location.href = `/Product.html?id=${productId}`;
                }, 100); // تأخير بسيط جداً
            }
        })();
    </script>
</body>
</html>
